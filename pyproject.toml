[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xg-context"
version = "1.0.0"
description = "Football xG models with defensive context from StatsBomb Open Data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Timur Byurchiev" }]
keywords = ["football", "soccer", "expected-goals", "statsbomb", "machine-learning"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mplsoccer>=1.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/Seekertame/football-xg-defensive-context"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests requiring network access to StatsBomb Open Data (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks", "data", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ARG",  # unused arguments
    "PD",   # pandas-vet
    "NPY",  # numpy-specific
]
ignore = [
    "RUF001", # ambiguous unicode: docstrings and messages are in Russian by spec
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
# X — общепринятое имя матрицы признаков в scikit-learn; переименование ухудшило бы читаемость.
"src/xg_context/models.py" = ["N803"]
"src/xg_context/preprocessing.py" = ["N803"]
"scripts/run_experiments.py" = ["N803", "N806"]

[tool.ruff.format]
docstring-code-format = true
